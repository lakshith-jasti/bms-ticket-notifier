name: BMS Ticket Monitor

on:
  workflow_dispatch:

concurrency:
  group: bms-ticket-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run BMS monitor (headed Chromium via virtual display)
        env:
          BMS_URL: ${{ vars.BMS_URL }}
          THEATRE_NAMES: ${{ vars.THEATRE_NAMES }}
          ALLU_FORMAT: ${{ vars.ALLU_FORMAT }}
          CHECK_INTERVAL: ${{ vars.CHECK_INTERVAL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: xvfb-run -a python bms_monitor.py
